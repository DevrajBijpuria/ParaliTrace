
name: 'project'
version: '1.0.0'


profile: 'project'


model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  project:
    # Config indicated by + and applies to all files under models/example/
      staging: { +materialized: view , +schema: STAGING}
      silver: { +materialized: table , +schema: SILVER}
      gold: { +materialized: table , +schema: GOLD}
      ops: { +materialized: view , +schema: OPS}
seeds:
  project:
    +schema: SILVER
    stations:
      +column_types:
        location_id: number
        pm25_sensor_id: number
        lat: float
        lon: float
        available_from: date
    route_points:
      +column_types:
        lat: float
        lon: float
        route_order: number
    regions:
      +column_types:
        priority: number
        min_lat: float
        max_lat: float
        min_lon: float
        max_lon: float